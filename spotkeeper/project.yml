name: SpotKeeper

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  SpotKeeper:
    type: application
    platform: iOS
    sources:
      - path: SpotKeeper
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: スポットキーパー
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 位置情報は V1 では「使用中のみ」に限定する。
        # Always 権限は近接通知を入れる V1.1 で追加する。
        NSLocationWhenInUseUsageDescription: 地図に現在地を表示し、近くの登録スポットを探すために使用します。
        NSPhotoLibraryUsageDescription: 訪問の記録に写真を追加するために使用します。
        # Google マップアプリがインストールされているかを判定するために必要。
        LSApplicationQueriesSchemes:
          - comgooglemaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.spotkeeper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 署名は Xcode で自分の Team を選ぶ。
        CODE_SIGN_STYLE: Automatic
